name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test backend
        run: mvn -f backend/pom.xml test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Performance measurement tool tests
        run: node scripts/tests/performance-measurements.test.mjs

      - name: Fast frontend tests
        run: npm --prefix frontend run test:fast

      - name: Typecheck
        run: npm --prefix frontend run typecheck

      - name: Lint
        run: npm --prefix frontend run lint

      - name: Build
        run: npm --prefix frontend run build
        env:
          BACKEND_URL: http://127.0.0.1:4174
          NEXT_PUBLIC_LINEWATCH_API_BASE_URL: http://127.0.0.1:4174

      - name: Install cross-browser Playwright runtimes
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser smoke tests
        run: npm --prefix frontend run test:smoke
        env:
          LINEWATCH_PLAYWRIGHT_REUSE_BUILD: "true"

      - name: Cross-browser map geometry
        run: npm --prefix frontend run test:browser-compat
        env:
          LINEWATCH_PLAYWRIGHT_REUSE_BUILD: "true"

      - name: Mobile rotated map viewport fit
        run: npm --prefix frontend run test:map-fit
        env:
          LINEWATCH_PLAYWRIGHT_REUSE_BUILD: "true"

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-browser-failures
          path: /tmp/linewatch-playwright-test-results
          if-no-files-found: ignore
          retention-days: 7
