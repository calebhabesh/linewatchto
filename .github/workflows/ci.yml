name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test backend
        run: mvn -f backend/pom.xml test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Check frontend dependency advisories
        run: npm --prefix frontend audit --audit-level=high

      - name: Script tool tests
        run: npm --prefix frontend run test:scripts:all

      - name: Fast frontend tests
        run: npm --prefix frontend run test:fast

      - name: Typecheck
        run: npm --prefix frontend run typecheck

      - name: Lint
        run: npm --prefix frontend run lint

      - name: Build
        run: npm --prefix frontend run build
        env:
          BACKEND_URL: http://127.0.0.1:4174
          NEXT_PUBLIC_LINEWATCH_API_BASE_URL: http://127.0.0.1:4174

      - name: Install cross-browser Playwright runtimes
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser smoke tests
        run: npm --prefix frontend run test:smoke
        env:
          LINEWATCH_PLAYWRIGHT_REUSE_BUILD: "true"

      - name: Cross-browser map geometry
        run: npm --prefix frontend run test:browser-compat
        env:
          LINEWATCH_PLAYWRIGHT_REUSE_BUILD: "true"

      - name: Mobile rotated map viewport fit
        run: npm --prefix frontend run test:map-fit
        env:
          LINEWATCH_PLAYWRIGHT_REUSE_BUILD: "true"

      - name: Offline dashboard snapshot gate
        run: npm --prefix frontend run test:offline
        env:
          LINEWATCH_PLAYWRIGHT_REUSE_BUILD: "true"

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-browser-failures
          path: /tmp/linewatch-playwright-test-results
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish production images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    concurrency:
      group: publish-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish the ARM64 release
        env:
          LINEWATCH_RELEASE_MANIFEST_FILE: ${{ runner.temp }}/release-images.env
          NEXT_PUBLIC_LINEWATCH_SUPPORT_URL: ${{ vars.NEXT_PUBLIC_LINEWATCH_SUPPORT_URL }}
          NEXT_PUBLIC_LINEWATCH_DASHBOARD_REFRESH_MS: ${{ vars.NEXT_PUBLIC_LINEWATCH_DASHBOARD_REFRESH_MS }}
          NEXT_PUBLIC_LINEWATCH_TRAIN_MARKER_REFRESH_MS: ${{ vars.NEXT_PUBLIC_LINEWATCH_TRAIN_MARKER_REFRESH_MS }}
          NEXT_PUBLIC_LINEWATCH_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_LINEWATCH_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_LINEWATCH_BING_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_LINEWATCH_BING_SITE_VERIFICATION }}
        run: scripts/prod-publish-release.sh

      - name: Check the published frontend image
        env:
          RELEASE_MANIFEST: ${{ runner.temp }}/release-images.env
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/prod-release.sh
          image="$(linewatch_read_release_value "$RELEASE_MANIFEST" LINEWATCH_FRONTEND_IMAGE)"
          docker run -d --name linewatch-ci-frontend -p 127.0.0.1:13000:3000 "$image" >/dev/null
          trap 'docker rm -f linewatch-ci-frontend >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:13000/healthz |
              jq -e '.service == "linewatch-frontend" and .status == "ok"' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs linewatch-ci-frontend
          exit 1

      - name: Save exact release image digests
        uses: actions/upload-artifact@v6
        with:
          name: release-images-${{ github.sha }}
          path: ${{ runner.temp }}/release-images.env
          if-no-files-found: error
          overwrite: true
