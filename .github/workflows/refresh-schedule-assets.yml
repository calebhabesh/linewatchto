name: Refresh schedule assets

# TTC and GO publish new GTFS every few weeks. The Map View routes and stops, the search indexes
# and the backend's GO stop list are generated from it at build time, so they need a release to
# follow a new schedule period. This opens (or updates) one pull request when the data changes.
on:
  schedule:
    - cron: "17 10 * * 1,4" # Monday and Thursday, 10:17 UTC
  workflow_dispatch:

concurrency:
  group: refresh-schedule-assets
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  refresh:
    name: Refresh schedule assets
    runs-on: ubuntu-latest
    env:
      BRANCH: automation/schedule-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate from the current GTFS
        # bash (not the default bash -e) adds pipefail, so a failed refresh is not hidden by tee.
        shell: bash
        run: scripts/refresh-schedule-assets.sh "$RUNNER_TEMP/gtfs" | tee "$RUNNER_TEMP/refresh.log"

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Schedule assets are current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install frontend dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm --prefix frontend ci

      # A quick check before pushing; CI itself is started on the branch below.
      - name: Fast frontend tests
        if: steps.changes.outputs.changed == 'true'
        run: npm --prefix frontend run test:fast

      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          feeds="$(grep -E '^(TTC|GO) feed:' "$RUNNER_TEMP/refresh.log")"
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add frontend/public/assets/linewatch/geographic backend/src/main/resources/regional/go-bus-stops.csv
          git commit -q -m "Refresh schedule-derived map and search assets from the current GTFS" -m "$feeds"
          git push --force origin "$BRANCH"
          # Pushes and pull requests made with GITHUB_TOKEN start no workflows, but a dispatch
          # does: it reports the Backend and Frontend checks main requires on this commit.
          gh workflow run ci.yml --ref "$BRANCH"
          body="$(printf 'Generated by scripts/refresh-schedule-assets.sh. Feeds:\n\n```\n%s\n```\n\nFast frontend tests passed in the workflow, and CI was started on this branch. Merge once it is green, let main CI publish, then deploy.\n' "$feeds")"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            echo "Updated the open schedule assets pull request." >> "$GITHUB_STEP_SUMMARY"
          elif gh pr create --head "$BRANCH" --base main --title "Refresh schedule assets" --body "$body"; then
            echo "Opened a schedule assets pull request." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pushed $BRANCH, but this repository does not let Actions open pull requests: ${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH" >> "$GITHUB_STEP_SUMMARY"
          fi
