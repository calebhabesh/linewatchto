name: Deploy Production
run-name: >-
  ${{ github.event_name == 'workflow_run'
  && format('Automatic deploy after CI for {0}', github.event.workflow_run.head_sha)
  || format('Manual deploy of {0}', inputs.sha || github.sha) }}

on:
  # Every finished CI run on main. The job condition below keeps only successful pushes.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Redeploys and rollbacks. Pause automatic deploys first when rolling back
  # (docs/production-vps.md, "Pause and roll back").
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character Git SHA to deploy (leave blank for selected main commit)
        required: false
        type: string
      recover_missing_manifest:
        description: Recover digests from SHA tags if a CI artifact expired (use only for recovery)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  packages: read
  id-token: write # Tailscale workload identity

# A run that will not deploy gets its own group: a queued run is replaced by the next one in its
# group, so a pull request from a fork's main branch must not displace a real deploy.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch'
    || (github.event.workflow_run.event == 'push'
    && github.event.workflow_run.conclusion == 'success'
    && vars.PRODUCTION_DEPLOY_PAUSED != 'true'))
    && 'production-deploy' || format('production-deploy-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && vars.PRODUCTION_DEPLOY_PAUSED != 'true')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      backend_image: ${{ steps.images.outputs.backend_image }}
      postgres_image: ${{ steps.images.outputs.postgres_image }}
      schedule_assets_image: ${{ steps.images.outputs.schedule_assets_image }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Runs after any earlier deploy has finished, so the live release is settled.
      - name: Select the automatic release
        id: auto
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$RUNNER_TEMP/ci-runs.json"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f per_page=100 > "$runs"
          label="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 \
            https://linewatchto.ca/version.json | jq -r '.buildLabel // empty')"
          selection="$(scripts/prod-select-auto-release.sh "$runs" "$label" "$GITHUB_SHA")"
          echo "$selection" | tee -a "$GITHUB_OUTPUT"
          {
            echo '### Automatic deploy'
            sed -n 's/^sha=$/Skipped./p; s/^sha=\(..*\)$/Deploying `\1`./p' <<< "$selection"
            sed -n 's/^reason=/Reason: /p' <<< "$selection"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify SHA and successful CI
        id: release
        if: github.event_name == 'workflow_dispatch' || steps.auto.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ steps.auto.outputs.sha || inputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Run this workflow from main.' >&2; exit 1; }
          sha="${REQUESTED_SHA:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Enter a full lowercase Git SHA.' >&2; exit 1; }
          git cat-file -e "$sha^{commit}"
          git merge-base --is-ancestor "$sha" "$GITHUB_SHA" || { echo 'SHA is not on main.' >&2; exit 1; }
          runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$sha" -f branch=main -f event=push -f per_page=100)"
          run_id="$(jq -r --arg sha "$sha" \
            '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last | select(.conclusion == "success") | .id // empty' <<< "$runs")"
          [[ -n "$run_id" ]] || { echo "No successful latest main push CI run for $sha." >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Retrieve exact release manifest
        if: steps.release.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          CI_RUN_ID: ${{ steps.release.outputs.run_id }}
          RECOVER_MISSING_MANIFEST: ${{ inputs.recover_missing_manifest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          if gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "release-images-$RELEASE_SHA" --dir "$RUNNER_TEMP/release"; then
            exit 0
          fi
          if git cat-file -e "$RELEASE_SHA:scripts/prod-publish-release.sh" 2>/dev/null && \
            [[ "$RECOVER_MISSING_MANIFEST" != true ]]; then
            echo 'This CI-built release is missing its digest manifest; refusing to substitute a mutable tag.' >&2
            exit 1
          fi
          echo 'Recovering a release from its SHA tags; verify the selected commit before continuing.'
          scripts/prod-record-image-digests.sh "$RELEASE_SHA" "$RUNNER_TEMP/release/release-images.env"

      - name: Log in to GHCR
        if: steps.release.outputs.sha != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify exact published image digests
        id: images
        if: steps.release.outputs.sha != ''
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: scripts/prod-verify-release-manifest.sh "$RUNNER_TEMP/release/release-images.env" "$RELEASE_SHA"

  deploy:
    name: Backup and deploy
    needs: verify
    if: needs.verify.outputs.sha != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://linewatchto.ca
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      FRONTEND_IMAGE: ${{ needs.verify.outputs.frontend_image }}
      BACKEND_IMAGE: ${{ needs.verify.outputs.backend_image }}
      POSTGRES_IMAGE: ${{ needs.verify.outputs.postgres_image }}
      # Empty for releases before plan 16.
      SCHEDULE_ASSETS_IMAGE: ${{ needs.verify.outputs.schedule_assets_image }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/home/ubuntu/apps/linewatchto' }}
    steps:
      # The release's own smoke check: main may already expect endpoints this release lacks.
      - name: Checkout the release
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Node for public smoke check
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The VPS has no public SSH. The runner joins the tailnet as an ephemeral tag:ci node through
      # Tailscale workload identity (GitHub's OIDC token; no stored Tailscale secret); the tailnet
      # policy lets tag:ci reach only the VPS's SSH port.
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          hostname: linewatchto-deploy-${{ github.run_id }}
          ping: ${{ env.VPS_HOST }}

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set production secret VPS_HOST}"
          : "${VPS_USER:?Set production secret VPS_USER}"
          : "${VPS_SSH_KEY:?Set production secret VPS_SSH_KEY}"
          : "${VPS_SSH_KNOWN_HOSTS:?Set production secret VPS_SSH_KNOWN_HOSTS}"
          [[ "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'Invalid VPS_SSH_PORT.' >&2; exit 1; }
          [[ "$VPS_DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]] || { echo 'Invalid VPS_DEPLOY_PATH.' >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Backup and deploy production
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" \
            bash -c "'"'tmp="$(mktemp)" && cat > "$tmp" && bash "$tmp" "$@" < /dev/null; res=$?; rm -f "$tmp"; exit $res'"'" bash \
            "$RELEASE_SHA" "$VPS_DEPLOY_PATH" \
            "$FRONTEND_IMAGE" "$BACKEND_IMAGE" "$POSTGRES_IMAGE" ${SCHEDULE_ASSETS_IMAGE:+"$SCHEDULE_ASSETS_IMAGE"} \
            < scripts/prod-remote-release.sh

      - name: Verify public production endpoints
        env:
          LINEWATCH_DEPLOY_FRONTEND_URL: https://linewatchto.ca
          LINEWATCH_DEPLOY_BACKEND_URL: https://api.linewatchto.ca
          LINEWATCH_DEPLOY_EXPECTED_SHA: ${{ env.RELEASE_SHA }}
        run: node scripts/smoke-deploy.mjs
