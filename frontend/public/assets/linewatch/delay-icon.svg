<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <mask id="hourglass-mask">
      <!-- Everything white is visible -->
      <rect x="0" y="0" width="24" height="24" fill="#ffffff" />
      <!-- Black circle cuts out the hourglass line to create a transparent gap -->
      <circle cx="18" cy="18" r="6.8" fill="#000000" />
    </mask>
    <mask id="badge-mask">
      <!-- Everything white is visible -->
      <rect x="0" y="0" width="24" height="24" fill="#ffffff" />
      <!-- Black cuts out the exclamation point -->
      <path d="M18 15.0v2.2" fill="none" stroke="#000000" stroke-width="1.3" stroke-linecap="round" />
      <circle cx="18" cy="20.5" r="0.75" fill="#000000" />
    </mask>
  </defs>
  <!-- Hourglass shape, masked to create a gap around the badge -->
  <g mask="url(#hourglass-mask)">
    <path fill="#FEEC41" transform="translate(-0.8 -0.8) scale(0.8)" d="M7 4v2h2v4a7.001 7.001 0 0 0 3.406 6A7.001 7.001 0 0 0 9 22v4H7v2h18v-2h-2v-4a7.001 7.001 0 0 0-3.406-6A7.001 7.001 0 0 0 23 10V6h2V4zm4 2h10v4c0 2.773-2.227 5-5 5s-5-2.227-5-5zm1.156 5c.446 1.723 1.98 3 3.844 3c1.863 0 3.398-1.277 3.844-3zM16 17c2.773 0 5 2.227 5 5v4h-1c0-2.21-1.79-4-4-4s-4 1.79-4 4h-1v-4c0-2.773 2.227-5 5-5z" />
  </g>
  <!-- Warning Badge -->
  <circle cx="18" cy="18" r="5.2" fill="#FEEC41" mask="url(#badge-mask)" />
</svg>