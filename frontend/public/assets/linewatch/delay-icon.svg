<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <mask id="clock-mask">
      <!-- Everything white is visible -->
      <rect x="0" y="0" width="24" height="24" fill="#ffffff" />
      <!-- Black circle cuts out the clock line to create a transparent gap -->
      <circle cx="18" cy="18" r="6.5" fill="#000000" />
    </mask>
  </defs>
  <!-- Clock Circle and Hands, masked to create a gap around the badge -->
  <g mask="url(#clock-mask)">
    <circle cx="11" cy="11" r="8" fill="none" stroke="#f59e0b" stroke-width="2" />
    <path d="M11 6v5h3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Warning Badge -->
  <circle cx="18" cy="18" r="5" fill="#f59e0b" />
  <!-- Exclamation Point inside Badge -->
  <path d="M18 15.5v2.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="18" cy="20.25" r="0.75" fill="#ffffff" />
</svg>