<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0808" />
    <title>LineWatchTO is offline</title>
    <link rel="icon" href="/assets/linewatch/pwa/app-icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/linewatch/pwa/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background:
          radial-gradient(circle at top left, rgba(248, 195, 2, 0.16), transparent 34rem),
          linear-gradient(135deg, #0d0808 0%, #111827 58%, #050608 100%);
        color: #f8fafc;
        display: flex;
        min-height: 100dvh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      }

      main {
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background: rgba(10, 12, 16, 0.92);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
        margin: 0 auto;
        max-width: 440px;
        padding: 24px;
      }

      img {
        border-radius: 8px;
        display: block;
        height: 64px;
        margin-bottom: 20px;
        width: 64px;
      }

      h1 {
        font-size: clamp(1.75rem, 8vw, 2.35rem);
        letter-spacing: 0;
        line-height: 1;
        margin: 0 0 12px;
      }

      p {
        color: #cbd5e1;
        font-size: 1rem;
        line-height: 1.55;
        margin: 0 0 14px;
      }

      a {
        align-items: center;
        background: #f8c302;
        border-radius: 8px;
        color: #111827;
        display: inline-flex;
        font-weight: 800;
        justify-content: center;
        margin-top: 10px;
        min-height: 44px;
        padding: 0 16px;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/linewatch/pwa/offline-icon-512.png" alt="" width="64" height="64" />
      <h1>LineWatchTO is offline</h1>
      <p>Current TTC service cannot be verified while your device is offline.</p>
      <p>Reconnect and reopen the dashboard for fresh alerts, station details, and commute impact checks.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
