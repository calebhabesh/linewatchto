<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Drop-in fixture map (plan 10 phase 6): two lines and five stations, drawn to
  docs/map-asset-contract.md, to prove a third System Map needs no engine code.
  Test-only; never served to riders.
-->
<svg
   width="100%"
   height="100%"
   version="1.1"
   viewBox="0 0 2000 1200"
   id="drop-in-map"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns="http://www.w3.org/2000/svg">
  <defs id="drop-in-defs" />
  <g inkscape:groupmode="layer" id="drop-in-lines-layer" inkscape:label="lines">
    <path id="line-a" inkscape:label="line-a" d="M 200,600 H 1800" style="fill:none;stroke:#c8102e;stroke-width:80;stroke-linecap:round;stroke-linejoin:round" />
    <path id="line-b" inkscape:label="line-b" d="M 1000,180 V 600 L 1400,1000" style="fill:none;stroke:#0072ce;stroke-width:80;stroke-linecap:round;stroke-linejoin:round" />
  </g>
  <g inkscape:groupmode="layer" id="drop-in-stations-layer" inkscape:label="stations">
    <circle id="station-alder" cx="200" cy="600" r="44" style="fill:#ffffff;stroke:#000000;stroke-width:14" />
    <circle id="station-birch" cx="1000" cy="600" r="64" style="fill:#ffffff;stroke:#000000;stroke-width:14" />
    <circle id="station-cedar" cx="1800" cy="600" r="44" style="fill:#ffffff;stroke:#000000;stroke-width:14" />
    <circle id="station-dogwood" cx="1000" cy="180" r="44" style="fill:#ffffff;stroke:#000000;stroke-width:14" />
    <circle id="station-elm" cx="1400" cy="1000" r="44" style="fill:#ffffff;stroke:#000000;stroke-width:14" />
  </g>
  <g inkscape:groupmode="layer" id="drop-in-station-labels-layer" inkscape:label="station-text">
    <text id="station-label-alder" data-station-label-for="alder" style="font-family:'TeX Gyre Heros';font-weight:bold;font-size:80px;fill:#000000" x="120" y="740">Alder</text>
    <text id="station-label-birch" data-station-label-for="birch" style="font-family:'TeX Gyre Heros';font-weight:bold;font-size:80px;fill:#000000" x="1090" y="520">Birch</text>
    <text id="station-label-cedar" data-station-label-for="cedar" style="font-family:'TeX Gyre Heros';font-weight:bold;font-size:80px;fill:#000000" x="1640" y="740">Cedar</text>
    <text id="station-label-dogwood" data-station-label-for="dogwood" style="font-family:'TeX Gyre Heros';font-weight:bold;font-size:80px;fill:#000000" x="1080" y="210">Dogwood</text>
    <text id="station-label-elm" data-station-label-for="elm" style="font-family:'TeX Gyre Heros';font-weight:bold;font-size:80px;fill:#000000" x="1480" y="1030">Elm</text>
  </g>
</svg>
