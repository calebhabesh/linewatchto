x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: ${LINEWATCH_IMAGE_REGISTRY:-ghcr.io/calebhabesh}/linewatch-postgres:${LINEWATCH_IMAGE_TAG:?Set LINEWATCH_IMAGE_TAG in .env.release}
    restart: unless-stopped
    mem_limit: 8g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linewatch}
      POSTGRES_USER: ${POSTGRES_USER:-linewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - linewatch-net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 1g
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    networks:
      - linewatch-net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${LINEWATCH_IMAGE_REGISTRY:-ghcr.io/calebhabesh}/linewatch-backend:${LINEWATCH_IMAGE_TAG:?Set LINEWATCH_IMAGE_TAG in .env.release}
    restart: unless-stopped
    mem_limit: 6g
    env_file:
      - ${LINEWATCH_PROD_ENV_FILE:-.env.production}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-linewatch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-linewatch}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 9090
      LINEWATCH_ENVIRONMENT: ${LINEWATCH_ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - linewatch-net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    image: ${LINEWATCH_IMAGE_REGISTRY:-ghcr.io/calebhabesh}/linewatch-frontend:${LINEWATCH_IMAGE_TAG:?Set LINEWATCH_IMAGE_TAG in .env.release}
    restart: unless-stopped
    mem_limit: 1g
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_URL: http://backend:8080
      LINEWATCH_BACKEND_URL: http://backend:8080
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - linewatch-net
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - linewatch-net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles:
      - tunnel
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "run",
        "--token",
        "${LINEWATCH_CLOUDFLARED_TUNNEL_TOKEN:-}"
      ]
    depends_on:
      - caddy
    networks:
      - linewatch-net
    logging: *default-logging

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    profiles:
      - observability
    command:
      [
        "run",
        "--server.http.listen-addr=0.0.0.0:12345",
        "--storage.path=/var/lib/alloy/data",
        "/etc/alloy/config.alloy"
      ]
    environment:
      LINEWATCH_ENVIRONMENT: ${LINEWATCH_ENVIRONMENT:-production}
      LINEWATCH_OBSERVABILITY_HOST: ${LINEWATCH_OBSERVABILITY_HOST:-oracle-vps-1}
      LINEWATCH_OBSERVABILITY_COMPOSE_PROJECT: ${LINEWATCH_OBSERVABILITY_COMPOSE_PROJECT:-}
      GRAFANA_CLOUD_PROMETHEUS_REMOTE_WRITE_URL: ${GRAFANA_CLOUD_PROMETHEUS_REMOTE_WRITE_URL:-}
      GRAFANA_CLOUD_PROMETHEUS_USERNAME: ${GRAFANA_CLOUD_PROMETHEUS_USERNAME:-}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USERNAME: ${GRAFANA_CLOUD_LOKI_USERNAME:-}
      GRAFANA_CLOUD_API_TOKEN: ${GRAFANA_CLOUD_API_TOKEN:-}
      POSTGRES_DB: ${POSTGRES_DB:-linewatch}
      POSTGRES_USER: ${POSTGRES_USER:-linewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_prod_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    ports:
      - "127.0.0.1:12345:12345"
    mem_limit: 512m
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - linewatch-net
    logging: *default-logging

volumes:
  postgres_prod_data:
    name: linewatchto_postgres_prod_data
    external: true
  redis_prod_data:
    name: linewatchto_redis_prod_data
    external: true
  caddy_data:
    name: linewatchto_caddy_data
    external: true
  caddy_config:
    name: linewatchto_caddy_config
    external: true
  alloy_prod_data:
    name: linewatchto_alloy_prod_data
    external: true

networks:
  linewatch-net:
    driver: bridge
