appId: ca.linewatchto.app
---
- launchApp:
    clearState: false

# 1. Initial Dashboard Launch & Rendering
- assertVisible: "LineWatchTO"
- assertVisible:
    id: "map-brand-chip"
- assertVisible: ".*Current Impact.*"

# 2. Network Toggling (TTC <-> Regional)
- tapOn:
    id: "network-regional"
- assertVisible: "GO & UP"
- tapOn:
    id: "network-ttc"
- assertVisible: "TTC"

# 3. Tab Navigation to Status
- tapOn: "Status"
- assertVisible: "Service impacts"
- assertVisible: "All.*"

# 4. Tab Navigation to Search & Detail Screen Navigation
- tapOn: "Search"
- assertVisible: "Stations"
- assertVisible: "Search stations"
- tapOn: "Search stations"
- inputText: "Union"
- assertVisible: "Union"
- tapOn: "Union"
- assertVisible: "Go back"
- tapOn: "Go back"

# 5. Tab Navigation to More & Display Theme Switching
- tapOn: "More"
- assertVisible: "More"
- assertVisible: "Display"
- assertVisible: "High contrast increases borders and foreground separation across the app."
- tapOn: "High contrast"
- assertVisible: "High contrast"
- tapOn: "Dark"
- assertVisible: "Dark"
- assertVisible: "About LineWatchTO"
