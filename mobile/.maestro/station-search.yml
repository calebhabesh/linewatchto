appId: ca.linewatchto.app
---
- launchApp:
    clearState: false

# Navigate to Search tab
- tapOn: "Search"
- assertVisible: "Stations"
- assertVisible: "Search stations"

# Search for TTC Station
- tapOn: "Search stations"
- inputText: "Bloor"
- assertVisible: "Bloor-Yonge"

# Open station details
- tapOn: "Bloor-Yonge"
- assertVisible: "Bloor-Yonge"
- assertVisible: "Go back"

# Navigate back to station list
- tapOn: "Go back"
- assertVisible: "Stations"

# Clear search and switch to Regional network
- eraseText: 10
- tapOn:
    id: "network-regional"
- assertVisible: "GO & UP"
- tapOn: "Search stations"
- inputText: "Union"
- assertVisible: "Union Station"
- tapOn: "Union Station"
- assertVisible: "Union Station"
- assertVisible: "Go back"
- tapOn: "Go back"
