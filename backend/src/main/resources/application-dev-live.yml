linewatch:
  diagnostics:
    raw-alerts:
      enabled: true
  ingestion:
    alerts:
      enabled: true
      fixed-delay: ${LINEWATCH_INGESTION_ALERTS_FIXED_DELAY:PT15S}
      max-dashboard-age: ${LINEWATCH_INGESTION_ALERTS_MAX_DASHBOARD_AGE:PT2M}
  arrivals:
    provider: ${LINEWATCH_ARRIVALS_PROVIDER:live}
    gtfs-refresh-enabled: ${LINEWATCH_ARRIVALS_GTFS_REFRESH_ENABLED:true}
  surface-arrivals:
    ttc-enabled: ${LINEWATCH_TTC_SURFACE_ARRIVALS_ENABLED:true}
    regional-enabled: ${LINEWATCH_REGIONAL_SURFACE_ARRIVALS_ENABLED:true}
  streetcar-positions:
    enabled: ${LINEWATCH_TTC_STREETCAR_POSITIONS_ENABLED:true}
  bus-positions:
    enabled: ${LINEWATCH_TTC_BUS_POSITIONS_ENABLED:true}
  regional:
    bus-positions:
      enabled: ${LINEWATCH_REGIONAL_GO_BUS_POSITIONS_ENABLED:true}
    arrivals:
      schedule-enabled: ${LINEWATCH_REGIONAL_ARRIVALS_SCHEDULE_ENABLED:true}
      schedule-refresh-enabled: ${LINEWATCH_REGIONAL_ARRIVALS_SCHEDULE_REFRESH_ENABLED:true}
