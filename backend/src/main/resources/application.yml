spring:
  application:
    name: linewatch-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5434/linewatch}
    username: ${SPRING_DATASOURCE_USERNAME:linewatch}
    password: ${SPRING_DATASOURCE_PASSWORD:linewatch_dev_password}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6380}

server:
  port: ${SERVER_PORT:8080}

linewatch:
  auth:
    secure-cookie: ${LINEWATCH_AUTH_SECURE_COOKIE:false}
    allowed-origins: ${LINEWATCH_AUTH_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://127.0.0.1:4173}
    rate-limit:
      enabled: ${LINEWATCH_AUTH_RATE_LIMIT_ENABLED:true}
      window: ${LINEWATCH_AUTH_RATE_LIMIT_WINDOW:PT15M}
      auth-max-requests: ${LINEWATCH_AUTH_RATE_LIMIT_AUTH_MAX_REQUESTS:12}
      password-reset-max-requests: ${LINEWATCH_AUTH_RATE_LIMIT_PASSWORD_RESET_MAX_REQUESTS:5}
      demo-max-requests: ${LINEWATCH_AUTH_RATE_LIMIT_DEMO_MAX_REQUESTS:20}
    password-reset:
      dev-links: ${LINEWATCH_AUTH_PASSWORD_RESET_DEV_LINKS:false}
      frontend-base-url: ${LINEWATCH_PASSWORD_RESET_FRONTEND_BASE_URL:http://localhost:3000}
      email:
        enabled: ${LINEWATCH_AUTH_PASSWORD_RESET_EMAIL_ENABLED:false}
        from: ${LINEWATCH_AUTH_PASSWORD_RESET_EMAIL_FROM:no-reply@linewatch.local}
    google:
      enabled: ${LINEWATCH_AUTH_GOOGLE_ENABLED:false}
      client-id: ${LINEWATCH_AUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${LINEWATCH_AUTH_GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${LINEWATCH_AUTH_GOOGLE_REDIRECT_URI:}
      jwk-set-uri: ${LINEWATCH_AUTH_GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
      authorization-uri: ${LINEWATCH_AUTH_GOOGLE_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
      token-uri: ${LINEWATCH_AUTH_GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
  ingestion:
    alerts:
      enabled: ${LINEWATCH_INGESTION_ALERTS_ENABLED:false}
      url: ${LINEWATCH_INGESTION_ALERTS_URL:https://alerts.ttc.ca/api/alerts/live-alerts}
      fixed-delay: ${LINEWATCH_INGESTION_ALERTS_FIXED_DELAY:PT2M}
      max-dashboard-age: ${LINEWATCH_INGESTION_ALERTS_MAX_DASHBOARD_AGE:PT10M}
      connect-timeout: ${LINEWATCH_INGESTION_ALERTS_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${LINEWATCH_INGESTION_ALERTS_READ_TIMEOUT:PT8S}
      surface-gtfs-rt-enabled: ${LINEWATCH_INGESTION_ALERTS_SURFACE_GTFS_RT_ENABLED:true}
      surface-gtfs-rt-urls: ${LINEWATCH_INGESTION_ALERTS_SURFACE_GTFS_RT_URLS:${LINEWATCH_INGESTION_ALERTS_SURFACE_GTFS_RT_URL:https://gtfsrt.ttc.ca/alerts/bus?format=text,https://gtfsrt.ttc.ca/alerts/streetcar?format=text}}
  arrivals:
    enabled: ${LINEWATCH_ARRIVALS_ENABLED:false}
    provider: ${LINEWATCH_ARRIVALS_PROVIDER:scheduled}
    schedule-horizon: ${LINEWATCH_ARRIVALS_SCHEDULE_HORIZON:PT90M}
    train-marker-horizon: ${LINEWATCH_ARRIVALS_TRAIN_MARKER_HORIZON:PT20M}
    max-arrivals-per-line: ${LINEWATCH_ARRIVALS_MAX_ARRIVALS_PER_LINE:4}
    live-gtfs-rt-url: ${LINEWATCH_ARRIVALS_LIVE_GTFS_RT_URL:https://gtfsrt.ttc.ca/trips/subway?format=text}
    live-gtfs-rt-initial-delay: ${LINEWATCH_ARRIVALS_LIVE_GTFS_RT_INITIAL_DELAY:PT10S}
    live-gtfs-rt-fixed-delay: ${LINEWATCH_ARRIVALS_LIVE_GTFS_RT_FIXED_DELAY:PT10S}
    live-source-name: ${LINEWATCH_ARRIVALS_LIVE_SOURCE_NAME:TTC GTFS-RT subway trip updates}
    gtfs-import-enabled: ${LINEWATCH_ARRIVALS_GTFS_IMPORT_ENABLED:false}
    gtfs-zip-path: ${LINEWATCH_ARRIVALS_GTFS_ZIP_PATH:}
    gtfs-refresh-enabled: ${LINEWATCH_ARRIVALS_GTFS_REFRESH_ENABLED:false}
    gtfs-refresh-package-url: ${LINEWATCH_ARRIVALS_GTFS_REFRESH_PACKAGE_URL:https://ckan0.cf.opendata.inter.prod-toronto.ca/api/3/action/package_show?id=merged-gtfs-ttc-routes-and-schedules}
    gtfs-refresh-initial-delay: ${LINEWATCH_ARRIVALS_GTFS_REFRESH_INITIAL_DELAY:PT30S}
    gtfs-refresh-fixed-delay: ${LINEWATCH_ARRIVALS_GTFS_REFRESH_FIXED_DELAY:PT24H}
    gtfs-refresh-min-service-days-remaining: ${LINEWATCH_ARRIVALS_GTFS_REFRESH_MIN_SERVICE_DAYS_REMAINING:14}
    gtfs-promotion-initial-delay: ${LINEWATCH_ARRIVALS_GTFS_PROMOTION_INITIAL_DELAY:PT30S}
    gtfs-promotion-fixed-delay: ${LINEWATCH_ARRIVALS_GTFS_PROMOTION_FIXED_DELAY:PT5M}
  performance:
    ttc:
      enabled: ${LINEWATCH_PERFORMANCE_TTC_ENABLED:true}
      url: ${LINEWATCH_PERFORMANCE_TTC_URL:https://www.ttc.ca/}
      connect-timeout: ${LINEWATCH_PERFORMANCE_TTC_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${LINEWATCH_PERFORMANCE_TTC_READ_TIMEOUT:PT8S}
      refresh-interval: ${LINEWATCH_PERFORMANCE_TTC_REFRESH_INTERVAL:PT24H}
      max-age: ${LINEWATCH_PERFORMANCE_TTC_MAX_AGE:PT48H}
  push:
    enabled: ${LINEWATCH_PUSH_ENABLED:false}
    vapid-public-key: ${LINEWATCH_PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${LINEWATCH_PUSH_VAPID_PRIVATE_KEY:}
    vapid-subject: ${LINEWATCH_PUSH_VAPID_SUBJECT:mailto:linewatch@example.invalid}
    evaluation-delay-ms: ${LINEWATCH_PUSH_EVALUATION_DELAY_MS:60000}
    cleared-notification-retention: ${LINEWATCH_PUSH_CLEARED_NOTIFICATION_RETENTION:PT24H}
  cache:
    dashboard:
      enabled: ${LINEWATCH_CACHE_DASHBOARD_ENABLED:true}
      full-dashboard-ttl: ${LINEWATCH_CACHE_DASHBOARD_FULL_TTL:PT30S}
      status-ttl: ${LINEWATCH_CACHE_DASHBOARD_STATUS_TTL:PT30S}
      map-ttl: ${LINEWATCH_CACHE_DASHBOARD_MAP_TTL:PT30S}
      alerts-ttl: ${LINEWATCH_CACHE_DASHBOARD_ALERTS_TTL:PT30S}
      ingestion-health-ttl: ${LINEWATCH_CACHE_DASHBOARD_INGESTION_HEALTH_TTL:PT15S}
      performance-ttl: ${LINEWATCH_CACHE_DASHBOARD_PERFORMANCE_TTL:PT6H}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name:linewatch-backend}
      environment: ${LINEWATCH_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s,5s
